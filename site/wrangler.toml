name = "bleib"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-01"

# Early-access signups. Create once with:
#   npx wrangler kv namespace create EARLY_ACCESS
# then put the returned id below (or bind it in the Pages dashboard).
[[kv_namespaces]]
binding = "EARLY_ACCESS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
